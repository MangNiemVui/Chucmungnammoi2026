    <!-- body -->
    <path d="M315 360c-10-60 28-124 88-154 44-22 104-20 150 6 34 19 55 51 60 89 6 48-7 94-35 129"/>
    <!-- neck + head -->
    <path d="M420 210c-18-34-30-66-22-101 6-25 24-43 51-52 22-8 45-3 60 12"/>
    <path d="M507 69c18 10 32 30 37 54 5 27-1 58-19 88"/>
