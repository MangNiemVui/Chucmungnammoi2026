    <path d="M458 106c-18 18-32 41-38 70"/>
    <path d="M430 96c-22 20-41 50-50 86"/>
    <path d="M403 104c-30 23-53 60-63 103"/>
    <!-- legs -->
    <path d="M355 342c-34 33-55 71-62 115"/>
    <path d="M405 372c-26 37-41 67-50 105"/>
    <path d="M530 375c20 30 37 58 48 98"/>
    <path d="M600 340c38 34 63 69 76 112"/>
    <!-- tail -->
    <path d="M650 328c48 30 74 61 84 99"/>
  </g>

  <!-- 2026 badge -->
  <g transform="translate(70 55)">
    <rect x="0" y="0" width="190" height="74" rx="18" fill="rgba(0,0,0,.18)" stroke="rgba(255,210,90,.35)"/>
    <text x="95" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="900" font-size="40" fill="url(#gold)">2026</text>
